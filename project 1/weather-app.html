<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Weather Forecast</title>
    <link rel="stylesheet" href="weather-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Forecast</h1>
            <p class="tagline">Get Real-Time Weather Updates</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <input 
                type="text" 
                id="locationInput" 
                class="location-input" 
                placeholder="Enter city name or coordinates (lat, lon)"
            >
            <button id="searchBtn" class="search-btn">Search</button>
            <button id="currentBtn" class="current-btn">📍 Current Location</button>
        </div>

        <!-- Current Weather Card -->
        <div class="current-weather">
            <div class="weather-card" id="weatherCard">
                <div class="location-display">
                    <h2 id="locationName">Loading...</h2>
                    <p id="coordinates" class="coordinates"></p>
                </div>
                
                <div class="current-info">
                    <div class="temperature-section">
                        <span id="temperature" class="temperature">--°C</span>
                        <div class="weather-desc">
                            <p id="condition" class="condition">Loading...</p>
                            <p id="feelsLike" class="feels-like">Feels like: --°C</p>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-box">
                            <span class="detail-icon">💧</span>
                            <div class="detail-content">
                                <p class="detail-label">Humidity</p>
                                <p id="humidity" class="detail-value">--%</p>
                            </div>
                        </div>
                        <div class="detail-box">
                            <span class="detail-icon">💨</span>
                            <div class="detail-content">
                                <p class="detail-label">Wind Speed</p>
                                <p id="windSpeed" class="detail-value">-- km/h</p>
                            </div>
                        </div>
                        <div class="detail-box">
                            <span class="detail-icon">🔽</span>
                            <div class="detail-content">
                                <p class="detail-label">Pressure</p>
                                <p id="pressure" class="detail-value">-- hPa</p>
                            </div>
                        </div>
                        <div class="detail-box">
                            <span class="detail-icon">👁️</span>
                            <div class="detail-content">
                                <p class="detail-label">Visibility</p>
                                <p id="visibility" class="detail-value">-- km</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 7-Day Forecast Section -->
        <div class="forecast-section">
            <h3 class="forecast-title">📅 7-Day Forecast</h3>
            <div class="forecast-container" id="forecastContainer">
                <!-- Forecast cards will be generated here -->
            </div>
        </div>

        <!-- Hourly Forecast Section -->
        <div class="hourly-section">
            <h3 class="forecast-title">⏰ Hourly Forecast (Next 24 Hours)</h3>
            <div class="hourly-container" id="hourlyContainer">
                <!-- Hourly cards will be generated here -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Open-Meteo API | Real-time weather data</p>
        </footer>
    </div>

    <script src="weather-script.js"></script>
</body>
</html>
